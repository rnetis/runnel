[workspace]
resolver = "2"
members = [
    "crates/rnl-core",
    "crates/rnl-crypto",
    "crates/rnl-transport",
    "crates/rnl-congestion",
    "crates/rnl-tun",
    "crates/rnl-config",
    "crates/rnl-observability",
    "crates/rnl-server",
    "crates/rnl-client",
    "apps/rnl-server",
    "apps/rnl-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rnl-core = { path = "crates/rnl-core" }
rnl-crypto = { path = "crates/rnl-crypto" }
rnl-transport = { path = "crates/rnl-transport" }
rnl-congestion = { path = "crates/rnl-congestion" }
rnl-tun = { path = "crates/rnl-tun" }
rnl-config = { path = "crates/rnl-config" }
rnl-observability = { path = "crates/rnl-observability" }
rnl-server = { path = "crates/rnl-server" }
rnl-client = { path = "crates/rnl-client" }

tokio = { version = "1", features = ["full"] }
snow = "0.9"
bytes = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.8"
hex = "0.4"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
